# Optional: `goreleaser release --clean` to build the archives and packages.
version: 2
project_name: permdrift
before:
  hooks:
    - go vet ./...
    - go test ./...
builds:
  - main: ./cmd/permdrift
    binary: permdrift
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]
nfpms:
  - id: packages
    package_name: permdrift
    vendor: permdrift
    homepage: https://github.com/permdrift/permdrift
    maintainer: permdrift <noreply@permdrift.invalid>
    description: Linux permission drift detector (sudo, SSH keys, SUID files).
    license: MIT
    formats: [deb, rpm]
    bindir: /usr/bin
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    contents:
      - src: LICENSE
        dst: /usr/share/doc/permdrift/LICENSE
      - src: README.md
        dst: /usr/share/doc/permdrift/README.md
checksum:
  name_template: SHA256SUMS
changelog:
  sort: asc
