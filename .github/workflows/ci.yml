name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ['1.21', 'stable']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: build (linux amd64 + arm64)
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build -trimpath -o bin/sudodrift-linux-$arch ./cmd/sudodrift
          done
      - name: example scripts parse
        run: for f in examples/systemd/*.sh scripts/*.sh; do sh -n "$f" 2>/dev/null || bash -n "$f"; done
      - name: demo smoke test
        run: make demo
